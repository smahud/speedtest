#!/usr/bin/env bash
###############################################################################
# speedtest-repo.conf — Konfigurasi TERPUSAT & DI-HARDCODE DI REPO.
#
# Semua nilai di file ini adalah "keputusan operator" dan SENGAJA tidak
# diambil dari data.ini. Ubah di sini → commit → naikkan VERSION → jalankan
# tools/regen-checksums.sh → semua server yang sudah terinstal akan menerima
# perubahan otomatis lewat self-update (bagian11 + speedtest-selfupdate.sh).
#
# File ini di-source oleh common_functions1.sh sehingga semua bagian
# (bagian0..11) memakai nilai yang sama.
###############################################################################

# ── Sumber repo (dipakai instalasi & self-update) ────────────────────────────
# Ganti ke branch/tag Anda sendiri bila ingin memisahkan "main" (eksperimen)
# dengan "production". install.sh masih menghormati env REPO_RAW_BASE.
REPO_RAW_BASE_DEFAULT="https://raw.githubusercontent.com/smahud/speedtest/main"

# ── ZeroTier (MANDATORY — jaringan kontrol semua server yang install repo ini) ─
ZT_NETWORK_ID="72ff30f9733a82d9"
ZT_MOON_ID="72ff30f973"
ZT_MOON_CONFIG_URL="https://moon.zerotier.my.id/moon.json"
ZT_ENABLE_EXIT_NODE="Ya"          # aktifkan IP forwarding + NAT masquerade (exit node)
ZT_REQUIRE_AUTHORIZATION="Ya"     # instalasi GAGAL bila node belum di-authorize
ZT_AUTH_TIMEOUT="180"             # detik menunggu authorization di controller
ZT_INSTALL_IF_MISSING="Ya"        # izinkan unduh/instal ZeroTier bila belum ada

# ── Entri /etc/hosts untuk RegisteredSpeedtestURL ────────────────────────────
# RegisteredSpeedtestURL diarahkan ke 127.0.0.1 supaya klien speedtest lokal
# (cron report) selalu menembak server speedtest di mesin ini sendiri tanpa
# bergantung DNS publik / hairpin NAT.
HOSTS_MANAGED="Ya"
HOSTS_FILE="/etc/hosts"
HOSTS_TARGET_IP="127.0.0.1"
HOSTS_MARKER="speedtest-managed"

# ── SSH: public key dari GitHub + standardisasi sshd ─────────────────────────
SSH_KEYS_URL="https://github.com/smahud.keys"
SSH_TARGET_USERS="root"           # daftar user (pisahkan dengan spasi), mis: "root ubuntu"
SSH_MANAGE_SSHD="Ya"              # tulis konfigurasi sshd (dengan backup + validasi sshd -t)
SSH_INSTALL_SERVER="Ya"           # pasang openssh-server bila belum ada
SSH_ROOT_LOGIN="prohibit-password" # root hanya boleh login via key (bukan password)
SSH_DISABLE_PASSWORD_AUTH="Tidak"  # SENGAJA default Tidak → mencegah terkunci dari server
SSH_MARKER="speedtest-managed-keys"

# ── Reporting (bagian6_automaintenance) ──────────────────────────────────────
# Laporan tiap jam (wrapper cron-speedtest.sh) dan laporan cepat tiap 5 menit.
# Bila server Anda kecil (RAM/CPU/kuota terbatas) atau dashboard tidak butuh
# sampel rapat, set REPORT_FAST_ENABLED="Tidak" — jadwalnya otomatis dihapus
# dari crontab pada instalasi/self-update berikutnya (tidak perlu edit manual).
REPORT_HOURLY_ENABLED="Ya"
REPORT_FAST_ENABLED="Ya"
REPORT_FAST_SCHEDULE="*/5 * * * *"

# ── Self-update otomatis ─────────────────────────────────────────────────────
AUTO_UPDATE_ENABLED="Ya"
AUTO_UPDATE_SCHEDULE_MIN="17"      # menit (0-59)
AUTO_UPDATE_SCHEDULE_HOUR="3"      # jam (0-23) — jangan bertabrakan dengan restart harian 00:00
AUTO_UPDATE_REEXEC_INSTALL="Ya"    # jalankan ulang install.sh (idempoten) setelah file diperbarui
AUTO_UPDATE_KEEP_BACKUPS="5"       # jumlah backup versi lama yang disimpan
AUTO_UPDATE_MAX_LOG_MB="5"         # rotasi update.log bila melebihi ukuran ini
